[workspace]
resolver = "3"
members = ["core/domain", "core/ffi", "cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
compiler_core = { path = "core/domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.10.0"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3"
