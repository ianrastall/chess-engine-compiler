syntax = "proto3";
package compiler;
option csharp_namespace = "Jupiter.ChessEngineCompiler.Messages";

message BuildOptions {
  string engine = 1;
  string source_ref = 2;
  string msys_root = 3;
  string output_root = 4;
  string architecture = 5;
  uint32 jobs = 6;
  bool pgo = 7;
  bool strip = 8;
  string backend = 9;
  string python_path = 10;
  string visual_studio = 11;
  string cuda_root = 12;
  string weights_path = 13;
  bool auto_architecture = 14;
}
message Request {
  uint64 request_id = 1;
  enum Operation { STATUS = 0; DEFAULTS = 1; PLAN = 2; START = 3; CANCEL = 4; HARDWARE = 5; GITHUB_START = 6; GITHUB_STATUS = 7; GITHUB_CANCEL = 8; }
  Operation operation = 2;
  BuildOptions options = 3;
  GitHubQuery github = 4;
}
message Hardware {
  string cpu_name = 1;
  string recommended = 2;
  string explanation = 3;
  repeated string choices = 4;
  string berserk_recommended = 5;
  string berserk_explanation = 6;
  repeated string berserk_choices = 7;
  string obsidian_recommended = 8;
  repeated string obsidian_choices = 9;
  string reckless_recommended = 10;
  repeated string reckless_choices = 11;
  string igel_recommended = 12;
  repeated string igel_choices = 13;
  string cpp_recommended = 14;
  repeated string cpp_choices = 15;
}
message GitHubQuery {
  enum Action { CATALOG = 0; RELEASE_ASSETS = 1; ARTIFACTS = 2; DOWNLOAD_RELEASE = 3; DOWNLOAD_ARTIFACT = 4; ACCOUNT = 5; SIGN_IN = 6; }
  Action action = 1;
  string engine = 2;
  string auth_mode = 3;
  string token = 4;
  uint32 page = 5;
  uint64 id = 6;
  string output_folder = 7;
}
message SourceVersion {
  uint64 id = 1;
  string label = 2;
  string reference = 3;
  string date = 4;
  string url = 5;
  bool prerelease = 6;
}
message DownloadItem {
  uint64 id = 1;
  string name = 2;
  uint64 size = 3;
  string date = 4;
  string digest = 5;
  bool expired = 6;
  string details = 7;
}
message GitHubSnapshot {
  string state = 1;
  string message = 2;
  repeated SourceVersion releases = 3;
  repeated SourceVersion development = 4;
  repeated DownloadItem items = 5;
  string login = 6;
  string output = 7;
  uint64 received = 8;
  uint64 total = 9;
  uint32 page = 10;
  bool more = 11;
  string default_branch = 12;
  bool releases_more = 13;
  bool development_more = 14;
}
message Snapshot {
  string state = 1;
  string phase = 2;
  string message = 3;
  string output = 4;
  string log_path = 5;
  string log_tail = 6;
}
message Response {
  uint64 request_id = 1;
  string error = 2;
  BuildOptions options = 3;
  repeated string steps = 4;
  Snapshot snapshot = 5;
  Hardware hardware = 6;
  GitHubSnapshot github = 7;
}
